<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ec">
  <meta name="description" content="Explore the RainBorrow umbrella in 3D.">
  <title>RainBorrow — Umbrella Studio</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <header class="topbar">
    <nav aria-label="Related views"><a class="secondary" href="simulator.html">Visibility lab ↗</a><a class="secondary" href="assets/RainBorrow-design.pdf" target="_blank" rel="noopener">Design sheet ↗</a></nav>
    <button class="primary" id="enter-free">Explore in free cam ↗</button>
  </header>
  <main id="studio">
    <section class="stage" id="stage" aria-label="Interactive umbrella viewer">
      <canvas id="render" tabindex="0" aria-label="3D umbrella. Drag to orbit, scroll to zoom, right-drag to pan. Arrow keys rotate. W A S D move, Q E move vertically. R resets the view."></canvas>
      <button class="icon-btn fullscreen" id="fullscreen" title="Toggle fullscreen" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
      <div class="loader" id="loading" role="status" aria-label="Loading umbrella"><span class="spinner"></span></div>
      <div class="fallback" id="fallback" hidden><img src="assets/umbrella-preview.png" alt="RainBorrow umbrella with bold canopy lettering"><p id="fallback-message">The 3D viewer needs WebGL.</p><a class="secondary" href="assets/RainBorrow-design.pdf">Open design sheet ↗</a></div>
      <div class="view-controls" aria-label="Camera presets"><button data-view="outside" aria-pressed="true">Outside</button><button data-view="inside" aria-pressed="false">Inside</button><button data-view="top" aria-pressed="false">Top</button><button data-view="detail" aria-pressed="false">Details</button></div>
      <div class="free-top"><button id="exit-free" class="secondary">↙ Back to studio</button></div>
      <div class="free-bottom"><button id="free-reset" class="secondary">Reset view</button></div>
    </section>
    <aside class="settings" aria-label="Studio settings">
      <div class="light-controls" aria-label="Lighting"><button data-light="day" aria-pressed="true">☼ Daylight</button><button data-light="night" aria-pressed="false">☾ Evening</button></div>
      <button class="secondary rotation" id="rotate" role="switch" aria-checked="false" aria-label="Slow rotation"><span class="switch-track" aria-hidden="true"><span></span></span>Slow rotation</button>
      <button id="reset" class="secondary">Reset camera ↺</button>
      <button id="save" class="secondary">Save this view ↓</button>
    </aside>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p>Enable JavaScript to use the 3D viewer. <a href="assets/RainBorrow-design.pdf">View design sheet.</a></p></noscript>
  <script type="module" src="studio.js"></script>
</body>
</html>
